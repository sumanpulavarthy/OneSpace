schema {
  query: Query
  mutation: Mutation
}

type Query {
  me: Me!
  myProfile: EmployeeProfile! @cost(weight: "10")
  myCalendar(from: DateTime!, to: DateTime!): [CalendarEntry!]!
    @cost(weight: "10")
  myManager: EmployeeProfile @cost(weight: "10")
  myDirectReports: [EmployeeProfile!]! @cost(weight: "10")
  myPresence: PresenceStatus! @cost(weight: "10")
  myMail(search: String, top: Int! = 10): [MailMessageSummary!]!
    @cost(weight: "10")
  myFiles(search: String, top: Int! = 10): [DriveItemSummary!]!
    @cost(weight: "10")
  myTeams: [TeamSummary!]! @cost(weight: "10")
  myChats(top: Int! = 10): [ChatSummary!]! @cost(weight: "10")
  myTasks(top: Int! = 20): [TodoTaskSummary!]! @cost(weight: "10")
  leaveBalance: String! @cost(weight: "10")
  searchPolicies(query: String!, limit: Int! = 5): [PolicySearchResult!]!
    @cost(weight: "10")
  recentQueries(limit: Int! = 20): [QueryLogEntry!]! @cost(weight: "10")
  zohoConnection: ZohoConnectionStatus! @cost(weight: "10")
}

type Mutation {
  ask(input: AskInput!): AssistantAnswer! @cost(weight: "10")
  connectZoho: ConnectZohoPayload! @cost(weight: "10")
  disconnectZoho: Boolean! @cost(weight: "10")
}

type AnswerBlock {
  id: String!
  kind: AnswerBlockKind!
  title: String
  columns: [AnswerColumn!]!
  rows: [[String!]!]!
  items: [KeyValueItem!]!
  totalRows: Int!
  source: SourceAttribution
  text: String
}

type AnswerColumn {
  key: String!
  label: String!
  format: FieldFormat!
}

type AssistantAnswer {
  sessionId: String!
  answer: String!
  intent: String!
  sources: [SourceAttribution!]!
  toolCalls: [ToolInvocation!]!
  latencyMs: Long!
  blocks: [AnswerBlock!]!
  grounding: GroundingReport!
}

type CalendarEntry {
  subject: String!
  start: DateTime!
  end: DateTime!
  showAs: String!
  location: String
}

type ChatSummary {
  topic: String
  chatType: String!
  lastMessageFrom: String
  lastMessagePreview: String
  lastMessageAt: DateTime
  webUrl: String
}

type ConnectZohoPayload {
  authorizationUrl: String!
}

type DriveItemSummary {
  name: String!
  webUrl: String
  lastModifiedAt: DateTime
  lastModifiedBy: String
  sizeBytes: Long
  isFolder: Boolean!
}

type EmployeeProfile {
  displayName: String!
  email: String
  jobTitle: String
  department: String
  officeLocation: String
}

type GroundingReport {
  checked: Boolean!
  grounded: Boolean!
  unverifiedValues: [String!]!
}

type KeyValueItem {
  label: String!
  value: String!
  format: FieldFormat!
}

type MailMessageSummary {
  subject: String!
  from: String
  receivedAt: DateTime!
  preview: String
  isRead: Boolean!
  importance: String!
  webLink: String
}

type Me {
  id: String!
  displayName: String!
  userPrincipalName: String!
  email: String
}

type PolicyDocument {
  id: String!
  title: String!
  category: String!
  content: String!
  sourceUrl: String
  sourceUpdatedAt: DateTime!
  syncedAt: DateTime!
}

type PolicySearchResult {
  document: PolicyDocument!
  score: Float!
  snippet: String!
}

type PresenceStatus {
  availability: String!
  activity: String!
}

type QueryLogEntry {
  id: String!
  userId: String!
  sessionId: String!
  question: String!
  intent: String!
  systemsCalled: [String!]!
  toolCalls: [ToolInvocation!]!
  responseSummary: String!
  failed: Boolean!
  latencyMs: Long!
  provider: String
  model: String
  escalated: Boolean!
  failedOver: Boolean!
  grounded: Boolean
  unverifiedValues: [String!]!
  inputTokens: Long
  outputTokens: Long
  createdAt: DateTime!
}

type SourceAttribution {
  system: SourceSystem!
  label: String!
  reference: String
}

type TeamSummary {
  displayName: String!
  description: String
}

type TodoTaskSummary {
  title: String!
  listName: String!
  status: String!
  importance: String!
  dueAt: DateTime
}

type ToolInvocation {
  name: String!
  system: SourceSystem!
  outcome: ToolInvocationOutcome!
  durationMs: Long!
  detail: String
}

type ZohoConnectionStatus {
  connected: Boolean!
  connectedAt: DateTime
  scopes: [String!]!
}

input AskInput {
  question: String!
  sessionId: String
}

enum AnswerBlockKind {
  TEXT
  TABLE
  KEY_VALUE
}

enum FieldFormat {
  TEXT
  NUMBER
  DATE
  DATE_TIME
  BOOLEAN
  LINK
  BYTES
}

enum SourceSystem {
  ZOHO_PEOPLE
  COMPLY_KARO
  MICROSOFT365
  ONE_SPACE
}

enum ToolInvocationOutcome {
  SUCCEEDED
  FAILED
  BLOCKED
  CONNECTION_REQUIRED
}

"The `DateTime` scalar type represents a date and time with time zone offset information."
scalar DateTime
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/date-time.html")

"The `Long` scalar type represents a signed 64-bit integer."
scalar Long
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/long.html")

"The purpose of the `cost` directive is to define a `weight` for GraphQL types, fields, and arguments. Static analysis can use these weights when calculating the overall cost of a query or response."
directive @cost(
  "The `weight` argument defines what value to add to the overall cost for every appearance, or possible appearance, of a type, field, argument, etc."
  weight: String!
) on
  | SCALAR
  | OBJECT
  | FIELD_DEFINITION
  | ARGUMENT_DEFINITION
  | ENUM
  | INPUT_FIELD_DEFINITION
